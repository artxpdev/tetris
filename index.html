<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Sweet Tetris</title>

<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ffd7ec" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sweet Tetris" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff7fb;
    --grid: #ffe6f2;
    --ink: #7a4a63;
    --muted: #bd8aa6;
    --bubble: #ff5fb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #ffd7ec 0%, #e7d0fb 46%, #c7f2e4 100%);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* floating background sweets */
  .sweets { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .sweets span {
    position: absolute;
    font-size: var(--s, 32px);
    filter: drop-shadow(0 6px 7px rgba(150,80,130,.18));
    animation: bob var(--d, 6s) ease-in-out var(--delay, 0s) infinite alternate;
    opacity: .92;
  }
  @keyframes bob {
    from { transform: translateY(0) rotate(var(--r, -8deg)); }
    to   { transform: translateY(-24px) rotate(calc(var(--r, -8deg) * -1)); }
  }

  #app {
    position: relative; z-index: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 16px;
  }

  .board-wrap {
    position: relative;
    padding: 14px;
    background: rgba(255,255,255,.55);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(150,70,120,.28), inset 0 0 0 3px rgba(255,255,255,.75);
  }
  .board-wrap::before,
  .board-wrap::after {
    content: "🍭";
    position: absolute;
    font-size: 34px;
    filter: drop-shadow(0 4px 5px rgba(150,80,130,.25));
  }
  .board-wrap::before { top: -20px; left: -16px; transform: rotate(-20deg); }
  .board-wrap::after  { content: "🍬"; bottom: -18px; right: -16px; transform: rotate(18deg); }

  canvas#board {
    display: block;
    background: var(--cream);
    border-radius: 16px;
    touch-action: none;
  }

  .side { display: flex; flex-direction: column; gap: 16px; width: 194px; }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 13px 18px;
    box-shadow: 0 12px 26px rgba(150,70,120,.16);
    border: 3px solid #ffe0ef;
  }
  .card:nth-child(1) { transform: rotate(-1.6deg); border-color: #ffd0e6; }
  .card:nth-child(2) { transform: rotate(1.3deg);  border-color: #dcccff; }
  .card:nth-child(3) { transform: rotate(-1deg);   border-color: #bff0dd; }
  .card:nth-child(4) { transform: rotate(1.5deg);  border-color: #ffe6b3; }
  .card:nth-child(5) { transform: rotate(-0.8deg); border-color: #cfe4ff; }
  .card h2 {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin-bottom: 3px;
    display: flex; align-items: center; gap: 6px;
  }
  .card .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
  .value.pop { animation: pop .32s ease; }
  @keyframes pop { 0% { transform: scale(1); } 42% { transform: scale(1.3); } 100% { transform: scale(1); } }
  #next { display: block; margin: 2px auto 0; }

  .hint { font-size: 13px; line-height: 1.95; color: var(--muted); font-weight: 500; }
  .hint b { color: var(--bubble); font-weight: 700; }

  .overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
    background: rgba(255, 231, 244, .8);
    backdrop-filter: blur(6px);
  }
  .overlay.hidden { display: none; }
  .overlay .emojis { font-size: 42px; letter-spacing: 8px; animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .overlay h1 {
    font-size: 58px; font-weight: 700; line-height: 1;
    background: linear-gradient(90deg, #ff7ac6, #ffb14d, #7ef0c8, #7aa8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(255,255,255,.65));
  }
  .overlay p { color: var(--ink); max-width: 350px; line-height: 1.6; font-weight: 500; }
  .btn {
    margin-top: 4px; padding: 14px 42px;
    font-family: inherit; font-size: 18px; font-weight: 700;
    color: #fff; background: linear-gradient(180deg, #ff8fd0, #ff5fb0);
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 0 #e23f92, 0 16px 24px rgba(226,63,146,.4);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #e23f92, 0 6px 12px rgba(226,63,146,.4); }

  .pop-candy {
    position: fixed; z-index: 4; pointer-events: none; font-size: 28px;
    animation: rise .95s ease-out forwards;
  }
  @keyframes rise {
    0%   { opacity: 1; transform: translateY(0) scale(.6) rotate(0); }
    100% { opacity: 0; transform: translateY(-130px) scale(1.25) rotate(var(--spin, 60deg)); }
  }

  @media (max-width: 640px) {
    #app { flex-direction: column; gap: 10px; padding: 10px; }
    .board-wrap { padding: 9px; border-radius: 20px; }
    canvas#board { width: min(66vw, 300px); height: auto; }
    .side { flex-direction: row; flex-wrap: wrap; width: auto; justify-content: center; gap: 10px; }
    .card { padding: 8px 14px; }
    .card:nth-child(n) { transform: none; }
    .card .value { font-size: 22px; }
    .hint { display: none; }
    .overlay h1 { font-size: 42px; }
    .board-wrap::before, .board-wrap::after { display: none; }
  }
</style>
</head>
<body>
<div class="sweets" id="sweets"></div>

<div id="app">
  <div class="board-wrap">
    <canvas id="board" width="300" height="600"></canvas>
  </div>
  <div class="side">
    <div class="card"><h2>🍭 Score</h2><div class="value" id="score">0</div></div>
    <div class="card"><h2>🍬 Lines</h2><div class="value" id="lines">0</div></div>
    <div class="card"><h2>🧁 Level</h2><div class="value" id="level">1</div></div>
    <div class="card"><h2>🍩 Next</h2><canvas id="next" width="120" height="120"></canvas></div>
    <div class="card hint">
      <b>←→</b> move&nbsp; <b>↑</b> rotate<br>
      <b>↓</b> soft drop&nbsp; <b>Space</b> hard drop<br>
      <b>P</b> pause
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="emojis" id="ovEmojis">🍭 🍬 🧁 🍩 🍪</div>
  <h1 id="ovTitle">SWEET TETRIS</h1>
  <p id="ovText">Stack the candy blocks and clear full rows for a sugar rush. Every 10 lines the treats fall faster!</p>
  <button class="btn" id="startBtn">Play</button>
</div>

<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 30;
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const ovEmojis = document.getElementById('ovEmojis');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');

  const SHAPES = {
    I: { color: '#5ec8ff', cells: [[0,1],[1,1],[2,1],[3,1]] },  // blue raspberry
    J: { color: '#a98bff', cells: [[0,0],[0,1],[1,1],[2,1]] },  // grape
    L: { color: '#ff9f43', cells: [[2,0],[0,1],[1,1],[2,1]] },  // orange drop
    O: { color: '#ffd23f', cells: [[1,0],[2,0],[1,1],[2,1]] },  // lemon
    S: { color: '#54e08a', cells: [[1,0],[2,0],[0,1],[1,1]] },  // green apple
    T: { color: '#ff6fd6', cells: [[1,0],[0,1],[1,1],[2,1]] },  // bubblegum
    Z: { color: '#ff6b6b', cells: [[0,0],[1,0],[1,1],[2,1]] },  // strawberry
  };
  const TYPES = Object.keys(SHAPES);
  const TREATS = ['🍭','🍬','🧁','🍩','🍪','🍫','🍰','🍦','🍮','🍡','🍥','🥧','🍯','🧃'];

  let grid, current, next, pos, score, lines, level, dropInterval, dropTimer, running, paused, rafId, lastTime = 0;

  const newGrid = () => Array.from({ length: ROWS }, () => Array(COLS).fill(null));

  function randomPiece() {
    const type = TYPES[(Math.random() * TYPES.length) | 0];
    return { type, color: SHAPES[type].color, cells: SHAPES[type].cells.map(c => c.slice()) };
  }

  const rotate = (cells) => cells.map(([x, y]) => [3 - y, x]);

  function normalize(cells) {
    const minX = Math.min(...cells.map(c => c[0]));
    const minY = Math.min(...cells.map(c => c[1]));
    return cells.map(([x, y]) => [x - minX, y - minY]);
  }

  function collides(cells, p) {
    return cells.some(([x, y]) => {
      const gx = p.x + x, gy = p.y + y;
      if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
      if (gy >= 0 && grid[gy][gx]) return true;
      return false;
    });
  }

  function spawn() {
    current = next || randomPiece();
    next = randomPiece();
    current.cells = normalize(current.cells);
    pos = { x: ((COLS - 4) / 2) | 0, y: -1 };
    if (collides(current.cells, pos)) gameOver();
    drawNext();
  }

  function lockPiece() {
    current.cells.forEach(([x, y]) => {
      const gy = pos.y + y;
      if (gy >= 0) grid[gy][pos.x + x] = current.color;
    });
    clearLines();
    spawn();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(c => c)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared) {
      score += [0, 100, 300, 500, 800][cleared] * level;
      lines += cleared;
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel !== level) { level = newLevel; pop(levelEl); }
      dropInterval = Math.max(80, 800 - (level - 1) * 70);
      pop(scoreEl); pop(linesEl);
      candyBurst(7 * cleared);
      updateHud();
    }
  }

  const updateHud = () => {
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  };

  function pop(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function candyBurst(count) {
    const rect = board.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'pop-candy';
      el.textContent = TREATS[(Math.random() * TREATS.length) | 0];
      el.style.left = (rect.left + Math.random() * rect.width) + 'px';
      el.style.top = (rect.top + rect.height * 0.25 + Math.random() * rect.height * 0.5) + 'px';
      el.style.setProperty('--spin', (Math.random() * 200 - 100) + 'deg');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
  }

  function move(dx, dy) {
    const p = { x: pos.x + dx, y: pos.y + dy };
    if (!collides(current.cells, p)) { pos = p; return true; }
    return false;
  }

  function tryRotate() {
    const rotated = normalize(rotate(current.cells));
    for (const dx of [0, -1, 1, -2, 2]) {
      const p = { x: pos.x + dx, y: pos.y };
      if (!collides(rotated, p)) { current.cells = rotated; pos = p; return; }
    }
  }

  function softDrop() {
    if (!move(0, 1)) lockPiece();
    dropTimer = 0;
  }

  function hardDrop() {
    let d = 0;
    while (move(0, 1)) d++;
    if (d) { score += d * 2; updateHud(); }
    lockPiece();
    dropTimer = 0;
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(rafId);
    ovEmojis.textContent = '🍬 😵 🍭';
    ovTitle.textContent = 'GAME OVER';
    ovText.textContent = `You scored ${score} with ${lines} lines cleared. Sweet run!`;
    startBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function start() {
    grid = newGrid();
    score = 0; lines = 0; level = 1;
    dropInterval = 800; dropTimer = 0;
    running = true; paused = false;
    next = randomPiece();
    spawn();
    updateHud();
    ovEmojis.textContent = '🍭 🍬 🧁 🍩 🍪';
    ovTitle.textContent = 'SWEET TETRIS';
    overlay.classList.add('hidden');
    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    loop(lastTime);
  }

  function loop(t) {
    if (!running) return;
    rafId = requestAnimationFrame(loop);
    if (paused) { lastTime = t; return; }
    const dt = t - lastTime;
    lastTime = t;
    dropTimer += dt;
    if (dropTimer >= dropInterval) {
      dropTimer = 0;
      if (!move(0, 1)) lockPiece();
    }
    draw();
  }

  // ---- candy rendering ----
  function candyPath(g, x, y, w, h, r) {
    if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawCandy(color, cx, cy, size, g) {
    const pad = size * 0.07;
    const x = cx * size + pad, y = cy * size + pad, s = size - pad * 2, r = size * 0.3;
    candyPath(g, x, y, s, s, r);
    g.fillStyle = color;
    g.fill();
    const grad = g.createLinearGradient(x, y, x, y + s);
    grad.addColorStop(0, 'rgba(255,255,255,.55)');
    grad.addColorStop(0.5, 'rgba(255,255,255,.06)');
    grad.addColorStop(1, 'rgba(0,0,0,.14)');
    candyPath(g, x, y, s, s, r);
    g.fillStyle = grad;
    g.fill();
    g.beginPath();
    g.ellipse(x + s * 0.34, y + s * 0.29, s * 0.17, s * 0.11, -0.5, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,.65)';
    g.fill();
    candyPath(g, x, y, s, s, r);
    g.strokeStyle = 'rgba(120,50,90,.16)';
    g.lineWidth = 1.5;
    g.stroke();
  }

  function draw() {
    ctx.fillStyle = '#fff7fb';
    ctx.fillRect(0, 0, board.width, board.height);
    ctx.strokeStyle = '#ffe6f2';
    ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, board.height); ctx.stroke(); }
    for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(board.width, y * CELL); ctx.stroke(); }

    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x]) drawCandy(grid[y][x], x, y, CELL, ctx);

    let gy = 0;
    while (!collides(current.cells, { x: pos.x, y: pos.y + gy + 1 })) gy++;
    ctx.globalAlpha = 0.22;
    current.cells.forEach(([x, y]) => {
      const yy = pos.y + y + gy;
      if (yy >= 0) drawCandy(current.color, pos.x + x, yy, CELL, ctx);
    });
    ctx.globalAlpha = 1;

    current.cells.forEach(([x, y]) => {
      const yy = pos.y + y;
      if (yy >= 0) drawCandy(current.color, pos.x + x, yy, CELL, ctx);
    });

    if (paused) {
      ctx.fillStyle = 'rgba(255,231,244,.85)';
      ctx.fillRect(0, 0, board.width, board.height);
      ctx.fillStyle = '#7a4a63';
      ctx.font = "700 30px 'Fredoka', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED 🍫', board.width / 2, board.height / 2);
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const cells = normalize(next.cells);
    const w = Math.max(...cells.map(c => c[0])) + 1;
    const h = Math.max(...cells.map(c => c[1])) + 1;
    const size = 24;
    const ox = (nextCanvas.width - w * size) / 2 / size;
    const oy = (nextCanvas.height - h * size) / 2 / size;
    cells.forEach(([x, y]) => drawCandy(next.color, x + ox, y + oy, size, nctx));
  }

  // ---- input ----
  document.addEventListener('keydown', (e) => {
    if (!running) return;
    switch (e.key) {
      case 'ArrowLeft': move(-1, 0); break;
      case 'ArrowRight': move(1, 0); break;
      case 'ArrowUp': case 'x': tryRotate(); break;
      case 'ArrowDown': softDrop(); break;
      case ' ': e.preventDefault(); hardDrop(); break;
      case 'p': case 'P': paused = !paused; break;
      default: return;
    }
    draw();
  });

  let tStart = null;
  board.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    tStart = { x: t.clientX, y: t.clientY, t: Date.now(), moved: false };
  }, { passive: true });
  board.addEventListener('touchmove', (e) => {
    if (!tStart || !running || paused) return;
    const t = e.touches[0];
    const dx = t.clientX - tStart.x, dy = t.clientY - tStart.y;
    if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 1 : -1, 0);
      tStart.x = t.clientX; tStart.moved = true; draw();
    } else if (dy > 28) {
      softDrop();
      tStart.y = t.clientY; tStart.moved = true; draw();
    }
  }, { passive: true });
  board.addEventListener('touchend', () => {
    if (!tStart || !running || paused) { tStart = null; return; }
    if (!tStart.moved && Date.now() - tStart.t < 250) { tryRotate(); draw(); }
    tStart = null;
  });

  startBtn.addEventListener('click', start);

  // ---- background sweets ----
  (function scatterSweets() {
    const container = document.getElementById('sweets');
    const n = window.innerWidth < 640 ? 9 : 17;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.textContent = TREATS[(Math.random() * TREATS.length) | 0];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.setProperty('--s', (22 + Math.random() * 32) + 'px');
      s.style.setProperty('--d', (4 + Math.random() * 5).toFixed(2) + 's');
      s.style.setProperty('--delay', (-Math.random() * 5).toFixed(2) + 's');
      s.style.setProperty('--r', (Math.random() * 20 - 10).toFixed(1) + 'deg');
      container.appendChild(s);
    }
  })();
})();
</script>
</body>
</html>
